# Loopback-only starter configuration. Review ACLs before exposing this server.
logoutput: stderr
internal: 127.0.0.1 port = 1080
external: 127.0.0.1
clientmethod: none
socksmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 127.0.0.1/32 to: 0.0.0.0/0
}
socks pass {
    from: 127.0.0.1/32 to: 127.0.0.0/8
    command: connect udpassociate
    protocol: tcp udp
}
